<ion-header [translucent]="true">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</ion-header>

<ion-content [fullscreen]="true">
  <body>

    <div class="Arriba">
      <div class="fon">
        <img src="../../../assets/Images/Usuario.webp" width="200">
      </div>
    </div>


    <div class="Contenido">
      
      <form (ngSubmit)="registrarUsuario()">
        <div class="mb-3">
          <label class="form-label">Rut</label>
          <input class="form-control" [(ngModel)]="usuario.rut" name="rut">
        </div>

        <div class="mb-3">
          <label class="form-label">Nombre Completo</label>
          <input class="form-control" [(ngModel)]="usuario.Nombre_completo" name="nombre">
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="usuario.Email" name="email">
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" [(ngModel)]="usuario.Contrasenia" name="contrasenia">
        </div>

        <div class="mb-3">
          <label class="form-label">Región</label>
          <input class="form-control" [(ngModel)]="usuario.Region" name="region">
        </div>

        <div class="mb-3">
          <label class="form-label">Comuna</label>
          <input class="form-control" [(ngModel)]="usuario.Comuna" name="comuna">
        </div>

        <div class="mb-3">
          <label class="form-label">Dirección</label>
          <input class="form-control" [(ngModel)]="usuario.Direccion" name="direccion">
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="exampleCheck1" required>
          <label class="form-check-label" for="exampleCheck1">Aceptar términos y condiciones</label>
        </div>

        <button type="submit" class="btn btn-outline-light">Registrar</button>
      </form>

      <p class="cosa">¿Ya tienes cuenta? <a class="aa" href="/home">Regístrate</a></p>

    </div>
    
  </body>
</ion-content>
