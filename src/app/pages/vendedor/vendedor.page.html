<ion-header [translucent]="true">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</ion-header>

<ion-content [fullscreen]="true">
  <body>
    
    <div class="Contenido">
  <ul class="list-group">
    <li class="list-group-item d-flex justify-content-between align-items-center"
        *ngFor="let orden of ordenes; let i = index">
      
      <!-- Lado izquierdo -->
      <div class="d-flex flex-column">
        <strong>{{ orden.nombreProducto }}</strong>
        <span class="text-muted">Pedido por: {{ orden.usuario }}</span>
      </div>

      <!-- Lado derecho -->
      <div class="d-flex align-items-center gap-2">
        <button type="button"
                class="btn btn-success btn-sm"
                [disabled]="orden.disponibilidad === 'entregado'"
                (click)="marcarEntregado(i)">
          {{ orden.disponibilidad === 'entregado' ? 'Entregado' : 'Marcar entregado' }}
        </button>
        <small class="text-body-secondary">{{ orden.fecha | date:'shortDate' }}</small>
      </div>

    </li>
  </ul>
</div>


  </body>
</ion-content>
