<ion-header [translucent]="true">
 <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</ion-header>

<ion-content [fullscreen]="true">
  <body>
    <div class="Contenedor">
  <img src="../../../assets/Images/Gato.avif" alt="Pago" class="imagen-pago">
  
  <div class="Contenido">
      <select [(ngModel)]="metodoPago" class="form-select">
        <option value="Débito">Débito</option>
        <option value="Crédito">Crédito</option>
        <option value="Transferencia">Transferencia</option>
      </select>

      <select [(ngModel)]="metodoEntrega" class="form-select">
        <option value="Retiro en tienda">Retiro en tienda</option>
        <option value="Despacho a domicilio">Despacho a domicilio</option>
      </select>

      <ion-button color="warning" (click)="realizarOrden()">Realizar orden</ion-button>

    </div>

  </div>

  </body>
</ion-content>
