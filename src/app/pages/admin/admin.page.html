<ion-header [translucent]="true">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</ion-header>

<ion-content [fullscreen]="true">
  <body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <img src="../../../assets/Images/Ferremas.png"  width="50">
        <a class="navbar-brand">FERREMAS ADMINISTRADOR</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="/home">Cerrar sesión</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page"  href="/home">Crear Usuario</a>
            </li>
          </ul>
          <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="Buscar Cuenta" aria-label="Search"/>
            <button class="btn btn-outline-success" type="submit">Buscar</button>
          </form>
        </div>
      </div>
    </nav>

    <div class="Contenido">

      <ul class="list-group">
        <li *ngFor="let usuario of usuarios" class="list-group-item d-flex justify-content-between align-items-center">
          <!-- Lado izquierdo -->
          <div class="d-flex align-items-center">
            <label class="mb-0">{{ usuario.Nombre_completo }} ({{ usuario.rut }})</label>
          </div>
          
          <!-- Lado derecho -->
          <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-success" (click)="abrirModalActualizarAlgo(usuario)">Actualizar algo</button>
            <button type="button" class="btn btn-success" (click)="abrirModalActualizarTodo(usuario)">Actualizar todo</button>
            <button type="button" class="btn btn-danger" (click)="borrarUsuario(usuario.id)">Borrar</button>
          </div>
        </li>
      </ul>
    </div>

  </body>
  <div class="modal" tabindex="-1" 
     [class.show]="modalActualizarAlgoAbierto" 
     [style.display]="modalActualizarAlgoAbierto ? 'block' : 'none'"
     aria-modal="true" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Actualizar Algo</h5>
        <button type="button" class="btn-close" (click)="cerrarModalActualizarAlgo()"></button>
      </div>
      <div class="modal-body">
        ¿Qué campo desea actualizar?
        <h2> </h2>
        <form>
          <select class="form-select form-select-lg mb-3" aria-label="Large select example"
                  [(ngModel)]="campoSeleccionado" name="campo"
                  (change)="cambiarCampo()">
            <option value="Nombre_completo">Nombre Completo</option>
            <option value="Email">Email</option>
            <option value="Password">Contraseña</option>
            <option value="Region">Región</option>
            <option value="Comuna">Comuna</option>
            <option value="Direccion">Dirección</option>
          </select>
          <div class="input-group mb-3">
            <span class="input-group-text" id="inputGroup-sizing-default">{{ campoSeleccionado || 'Campo' }}</span>
            <input type="text" class="form-control"
                  [(ngModel)]="nuevoValor" name="valor"
                  [placeholder]="'Nuevo ' + (campoSeleccionado || 'valor')" />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="aceptarActualizar()">Aceptar</button>
        <button type="button" class="btn btn-secondary" (click)="cerrarModalActualizarAlgo()">Cerrar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" tabindex="-1" 
     [class.show]="modalActualizarTodoAbierto" 
     [style.display]="modalActualizarTodoAbierto ? 'block' : 'none'"
     aria-modal="true" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Actualizar Todos los Datos</h5>
        <button type="button" class="btn-close" (click)="cerrarModalActualizarTodo()"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-2">
            <label>RUT</label>
            <input class="form-control" [(ngModel)]="usuarioEdit.rut" name="rut" />
          </div>
          <div class="mb-2">
            <label>Nombre Completo</label>
            <input class="form-control" [(ngModel)]="usuarioEdit.Nombre_completo" name="nombre" />
          </div>
          <div class="mb-2">
            <label>Email</label>
            <input class="form-control" [(ngModel)]="usuarioEdit.Email" name="email" />
          </div>
          <div class="mb-2">
            <label>Contraseña</label>
            <input type="password" class="form-control" [(ngModel)]="usuarioEdit.Contrasenia" name="password" />
          </div>
          <div class="mb-2">
            <label>Región</label>
            <input class="form-control" [(ngModel)]="usuarioEdit.Region" name="region" />
          </div>
          <div class="mb-2">
            <label>Comuna</label>
            <input class="form-control" [(ngModel)]="usuarioEdit.Comuna" name="comuna" />
          </div>
          <div class="mb-2">
            <label>Dirección</label>
            <input class="form-control" [(ngModel)]="usuarioEdit.Direccion" name="direccion" />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" (click)="aceptarActualizarTodo()">Aceptar</button>
        <button class="btn btn-secondary" (click)="cerrarModalActualizarTodo()">Cerrar</button>
      </div>
    </div>
  </div>
</div>

</ion-content>
