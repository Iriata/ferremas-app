<ion-header [translucent]="true">
   <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</ion-header>

<ion-content [fullscreen]="true">

  <body>
    
    <div class="Arriba">
      <div class="fon">
        <img src="../../../assets/Images/Ferremas.png" width="100">
      </div>
      <H1 class="frer">FERREMAS</H1>
    </div>

    <div class="Login">

      <div class="Contenido">

        <form (ngSubmit)="login()">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input [(ngModel)]="email" name="email" type="email" class="form-control" id="email" placeholder="usuario@email.com" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input [(ngModel)]="password" name="password" type="password" class="form-control" id="password" required>
          </div>

          <p class="cosa">¿Olvidaste tu contraseña?<a class="aaa" href="/registro"> Cambiar</a></p>

          <button type="submit" class="btn btn-outline-light">Iniciar sesión</button>

          <p class="cosa">¿No tienes cuenta? <a class="aa" href="/registrar">Regístrate</a></p>
        </form>


      </div>

    </div>


  </body>
</ion-content>
