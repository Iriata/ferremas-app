<ion-header [translucent]="true">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</ion-header>

<ion-content *ngIf="producto" class="ion-padding" [fullscreen]="true">

  <div class="detalle-container">

    <img [src]="producto.Ruta_imagen_producto" alt="Imagen del producto" class="detalle-imagen">

    <div class="detalle-info">

      <h2 class="card-title">{{ producto.Nombre_producto }}</h2>
      <p class="card-text">{{ producto.Descripcion_producto }}</p>
      <h4 class="text-primary">Precio: ${{ producto.Precio_producto }}</h4>

      <div class="botones">
        <ion-button color="success" routerLink="/forcompra">Comprar</ion-button>
        <ion-button color="success" (click)="agregarAlCarrito()">Agregar al carrito</ion-button>
      </div>

    </div>
    
  </div>

  <div class="boton-volver">
    <ion-button color="medium" routerLink="/cliente">Volver</ion-button>
  </div>

</ion-content>
